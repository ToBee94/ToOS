name: Publish to GitHub Packages

# Mirrors every version tag to GitHub Packages (npm.pkg.github.com), using
# the built-in GITHUB_TOKEN — no npmjs.org 2FA/OTP involved, unlike
# `npm publish` to the public registry, which still has to be run manually.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@tobee94"

      - run: npm ci

      - run: npm run build

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
